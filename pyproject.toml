[project]
name = "nemesisprotocol"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.18",
    "langchain-anthropic>=1.7.0",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "ursina>=8.3.0",
    "uvicorn>=0.52.4",
]

[tool.uv.workspace]
members = [
    "PracticeUrsinaEngine",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
